<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハッシュタグ集計 / YouTube検索ログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrap">

    <header class="masthead">
      <p class="masthead__eyebrow">youtube search log</p>
      <h1 class="masthead__title">検索語からハッシュタグの出現頻度を数える</h1>
      <p class="masthead__desc">検索語 X を入力すると、シークレットモードでの検索結果を想定した動画を上位から取得し、タイトルと概要欄に書かれた <span class="tagmark">#ハッシュタグ</span> を数え上げます。</p>
    </header>

    <section class="console" aria-label="検索設定">

      <div class="field">
        <label class="field__label" for="keyword">
          <span class="field__num">01</span>検索語 X
        </label>
        <div class="field__input">
          <span class="prompt">$</span>
          <input type="text" id="keyword" placeholder="例）自宅トレーニング" autocomplete="off">
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="count">
          <span class="field__num">02</span>取得件数 Y
        </label>
        <div class="field__slider">
          <input type="range" id="count" min="50" max="250" step="50" value="50">
          <div class="field__ticks" aria-hidden="true">
            <span>50</span><span>100</span><span>150</span><span>200</span><span>250</span>
          </div>
          <output class="field__value" for="count" id="countValue">50<span class="unit">件</span></output>
        </div>
      </div>

      <div class="field field--action">
        <button id="runBtn" class="run-btn" type="button">
          <span>集計を実行</span>
        </button>
        <p class="quota-note" id="quotaNote"></p>
      </div>

    </section>

    <section class="status" id="statusArea" hidden>
      <p id="statusText">取得中…</p>
      <div class="status__bar"><div class="status__bar-fill" id="statusFill"></div></div>
    </section>

    <section class="results" id="resultsArea" hidden>

      <div class="results__meta">
        <h2 id="resultsHeading">結果</h2>
        <p id="resultsSub"></p>
      </div>

      <ol class="taglist" id="taglist"></ol>

      <details class="videos-disclosure">
        <summary>取得した動画一覧(<span id="videoCount">0</span>件)を見る</summary>
        <ol class="videolist" id="videolist"></ol>
      </details>

    </section>

    <section class="error" id="errorArea" hidden>
      <p id="errorText"></p>
    </section>

    <footer class="footnote">
      <p>データ取得元:YouTube Data API v3(<code>search.list</code> / <code>videos.list</code>)。検索順位は API の <code>order=relevance</code> による近似で、実際のブラウザ表示順と完全には一致しません。</p>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
